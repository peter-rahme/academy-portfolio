<header class="site-header">
  <nav class="container nav">
    <a routerLink="/home" class="logo" (click)="closeMenu()">Peter Rahme</a>

    <button
      class="menu-toggle"
      type="button"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.is-open]="menuOpen()">
      <li>
        <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      </li>
      <li>
        <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
      </li>
    </ul>
  </nav>
</header>
