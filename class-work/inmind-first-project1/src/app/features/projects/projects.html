<section class="projects container">
  <p class="eyebrow">Browse My Recent</p>
  <h1>Projects</h1>

  <div class="project-grid">
    @for (project of projects; track project.title) {
      <article class="project-card">
        <div class="thumb" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path
              d="M9 18l-6-6 6-6M15 6l6 6-6 6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <h2>{{ project.title }}</h2>
        <p>{{ project.description }}</p>

        <div class="btn-row">
          <a class="btn btn-secondary" [href]="project.githubUrl" target="_blank" rel="noopener">GitHub</a>
          <a class="btn btn-primary" [href]="project.demoUrl" target="_blank" rel="noopener">Live Demo</a>
        </div>
      </article>
    }
  </div>
</section>
